<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="discShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </radialGradient>
  </defs>

  <!-- Background Circle (Vinyl Disc) -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#vibeGrad)" stroke-width="2.5" />

  <!-- Concentric Grooves -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,2" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#334155" stroke-width="0.8" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="#1e293b" stroke-width="0.8" />

  <!-- Center Hub with Gradient -->
  <circle cx="32" cy="32" r="11" fill="url(#vibeGrad)" />

  <!-- Music Note Icon inside hub -->
  <path d="M30 26.5v8.2a2.8 2.8 0 1 1-1.8-2.6v-5.6l6-1.5v6.5a2.8 2.8 0 1 1-1.8-2.6v-4z" fill="#ffffff" />

  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="2.2" fill="#0f172a" />
</svg>
